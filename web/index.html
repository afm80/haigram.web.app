<!DOCTYPE html>
<html lang="ar">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="application-name" content="Haigram">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Haigram">
  <meta property="og:title" content="Haigram">

  <meta property="og:image" content="https://haigram.web.app/icons/Icon-512.png">
  <meta property="og:image:alt" content="Haigram">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Haigram">
  <meta name="twitter:description" content="صور ومنشورات وقصص على Haigram">
  <meta name="twitter:image" content="https://haigram.web.app/icons/Icon-512.png">
  <meta name="description" content="Haigram - صور ومنشورات وقصص">
  <meta name="theme-color" content="#0B0B12" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#F7F6FB" media="(prefers-color-scheme: light)">

  <!-- iOS PWA -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">
  <title>Haigram</title>

  <!-- تم حذف سكربت تغيير عرض الـviewport: كان يجعل عرض الصفحة أكبر من شاشة الجوال/الآيباد (تخطيط بعرض ~924 على شاشة 768) فتظهر الواجهة مقصوصة. نستخدم width=device-width القياسي. -->

  <style>
    html, body { margin: 0; height: 100%; min-height: 100svh; background: #0B0B12; overflow: hidden; }
    /* اتجاه RTL على مستوى الصفحة يزيح عناصر الفيديو (Platform Views) إلى اليمين.
       Flutter يتولى اتجاه النص بنفسه، لذلك نثبّت اتجاه حاويات Flutter على LTR. */
    flt-glass-pane, flt-scene-host, flt-scene, flt-platform-view, flt-platform-view-slot { direction: ltr; }
    /* تثبيت موضع عنصر الفيديو عند أصل الصفحة حتى لا يتأثر بالموضع الافتراضي حسب اتجاه الصفحة. */
    flt-platform-view-slot { left: 0; top: 0; }
    @media (prefers-color-scheme: light) {
      html, body { background: #F7F6FB; }
      #boot-splash { background: radial-gradient(circle at 50% 38%, #EDEBF4 0, #F7F6FB 54%, #F7F6FB 100%); }
      .boot-copy { color: #1C1B22; }
      .boot-fallback { color: #1C1B22; }
      .boot-loader { background: #D8D5E1; }
      #install-banner { background: #FFFFFF; color: #1C1B22; border-color: rgba(0,0,0,.08); }
      #install-no { color: #666574; }
    }
    #boot-splash {
      position: fixed; inset: 0; z-index: 100000; display: grid; place-items: center;
      box-sizing: border-box; padding: 24px;
      padding: max(20px, env(safe-area-inset-top)) 24px max(20px, env(safe-area-inset-bottom));
      overflow-y: auto;
      background: radial-gradient(circle at 50% 38%, #1E1238 0, #0B0B12 54%, #0B0B12 100%);
      transition: opacity 320ms ease, visibility 320ms ease;
    }
    #boot-splash > div { width: 100%; max-width: 360px; }
    #boot-splash.is-hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .boot-mark {
      width: 96px; height: 96px; display: grid; place-items: center;
      margin-inline: auto;
      background: url("icons/haigram-mark.png") center / contain no-repeat;
      filter: drop-shadow(0 0 18px rgba(66, 212, 244, .18)) drop-shadow(0 0 12px rgba(255, 0, 81, .14));
      animation: boot-enter .7s cubic-bezier(.22, 1, .36, 1) both, boot-breathe 1.8s ease-in-out .7s infinite;
    }
    .boot-copy {
      display: flex; justify-content: center; direction: ltr; overflow: hidden;
      margin-top: 18px; color: #F3F5F9; font: 700 20px system-ui, sans-serif;
    }
    .boot-part { display: inline-block; opacity: 0; filter: blur(5px); white-space: nowrap; }
    .brand-purple { color: #7C3AED; }
    .brand-violet { color: #A78BFA; }
    .boot-hai { animation: name-from-left .72s cubic-bezier(.22, 1, .36, 1) .12s both; }
    .boot-der {
      width: 1.7em; overflow: hidden;
      animation: name-der-morph 1.05s cubic-bezier(.22, 1, .36, 1) .12s both;
    }
    .boot-gram {
      width: 2.8em; overflow: hidden;
      animation: name-gram-join .72s cubic-bezier(.22, 1, .36, 1) .92s both;
    }
    .boot-loader { width: 28px; height: 3px; margin: 18px auto 0; border-radius: 9px; background: #202832; overflow: hidden; }
    .boot-loader::after { content: ""; display: block; width: 45%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #7C3AED, #A78BFA); animation: boot-progress 1.1s ease-in-out infinite alternate; }
    .boot-fallback { margin-top: 22px; color: #F3F5F9; font: 14px/1.6 system-ui, sans-serif; text-align: center; overflow-wrap: anywhere; }
    .boot-fallback[hidden] { display: none; }
    .boot-fallback button {
      display: block; width: 100%; max-width: 240px; min-height: 48px; margin: 12px auto 0; padding: 12px 18px;
      border: 0; border-radius: 12px; appearance: none; -webkit-appearance: none;
      background: #7C3AED; color: #fff; font: 700 15px/1.3 system-ui, sans-serif;
      white-space: normal; overflow-wrap: anywhere; cursor: pointer; touch-action: manipulation;
    }
    .boot-fallback button:disabled { opacity: .75; }
    @keyframes boot-breathe { 50% { transform: scale(.96); } }
    @keyframes boot-enter {
      from { opacity: 0; transform: translateY(12px) scale(.82); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes name-from-left {
      0% { opacity: 0; transform: translateX(-32px) scale(.92); filter: blur(5px); }
      70% { opacity: 1; transform: translateX(2px) scale(1.04); filter: blur(0); }
      100% { opacity: 1; transform: translateX(0) scale(1); filter: blur(0); }
    }
    @keyframes name-der-morph {
      0% { opacity: 0; width: 1.7em; transform: translateX(-22px); filter: blur(5px); }
      42% { opacity: 1; width: 1.7em; transform: translateX(0); filter: blur(0); }
      72% { opacity: 1; width: 1.7em; }
      100% { opacity: 0; width: 0; filter: blur(4px); }
    }
    @keyframes name-gram-join {
      0% { opacity: 0; width: 0; transform: translateX(24px); filter: blur(5px); }
      75% { opacity: 1; transform: translateX(-2px); filter: blur(0); }
      100% { opacity: 1; width: 2.8em; transform: translateX(0); filter: blur(0); }
    }
    @keyframes boot-progress { to { transform: translateX(125%); } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }
    #install-banner {
      display: none; position: fixed; z-index: 99999; left: 12px; right: 12px; bottom: 76px;
      background: #171A24; color: #F3F5F9; border: 1px solid rgba(255,255,255,.08); border-radius: 18px; padding: 14px 16px;
      font-family: system-ui, sans-serif; font-size: 14px; line-height: 1.5;
      box-shadow: 0 8px 30px rgba(0,0,0,.5); align-items: center; gap: 12px;
    }
    #install-banner button {
      border: 0; border-radius: 10px; padding: 9px 14px; font-weight: 700; cursor: pointer;
    }
    #install-yes { background: #7C3AED; color: #fff; }
    #install-no { background: transparent; color: #9AA2B5; }
    #install-text { flex: 1; }
  </style>
</head>
<body>
  <div id="boot-splash" role="status" aria-label="جارٍ تحميل Haigram">
    <div>
      <div class="boot-mark"></div>
      <div class="boot-copy" aria-hidden="true">
        <span class="boot-part boot-hai"><span class="brand-purple">H</span>ai</span><span class="boot-part boot-der">der</span><span class="boot-part boot-gram"><span class="brand-violet">g</span>ram</span>
      </div>
      <div id="boot-loader" class="boot-loader"></div>
      <div id="boot-error" class="boot-fallback" role="alert" dir="rtl" hidden>
        تعذر تشغيل التطبيق. تحقق من اتصال الإنترنت ثم حاول مرة أخرى.
        <br><button id="boot-retry" type="button">إعادة المحاولة</button>
      </div>
    </div>
  </div>
  <div id="install-banner">
    <div id="install-text"></div>
    <button id="install-yes">تثبيت</button>
    <button id="install-no">لاحقاً</button>
  </div>

  <script>
    (function () {
      var splash = document.getElementById('boot-splash');
      var startedAt = Date.now();
      var hideScheduled = false;
      function hideSplash() {
        if (!splash || hideScheduled) return;
        hideScheduled = true;
        var delay = Math.max(0, 1350 - (Date.now() - startedAt));
        setTimeout(function () {
          splash.classList.add('is-hidden');
          setTimeout(function () { if (splash && splash.parentNode) splash.parentNode.removeChild(splash); }, 400);
        }, delay);
      }
      window.addEventListener('flutter-first-frame', function () {
        window.haigramAppReady = true;
        hideSplash();
        if (window.haigramShowInstallBanner) {
          window.haigramShowInstallBanner();
        }
      }, { once: true });
      document.getElementById('boot-retry').onclick = function (event) {
        var button = event.currentTarget;
        button.disabled = true;
        button.textContent = 'جارٍ تحديث التطبيق...';
        var target = new URL(window.location.href);
        target.searchParams.set('haigram_retry', Date.now().toString());
        function reload() { window.location.replace(target.toString()); }
        var recovery = Promise.resolve().then(async function () {
          if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
            var registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations
              .filter(function (registration) {
                return new URL(registration.scope).origin === window.location.origin;
              })
              .map(function (registration) { return registration.unregister(); }));
          }
          if (window.caches && window.caches.keys) {
            var cacheNames = await window.caches.keys();
            await Promise.all(cacheNames
              .filter(function (name) {
                return name === 'flutter-app-cache' ||
                  name === 'flutter-app-manifest' ||
                  name === 'flutter-temp-cache';
              })
              .map(function (name) { return window.caches.delete(name); }));
          }
        });
        recovery.catch(function (error) {
          console.warn('Unable to clear cached Haigram files before retry:', error);
        });
        Promise.race([
          recovery,
          new Promise(function (resolve) { setTimeout(resolve, 1800); })
        ]).finally(reload);
      };
      setTimeout(function () {
        if (window.haigramAppReady) return;
        document.getElementById('boot-loader').style.display = 'none';
        document.getElementById('boot-error').hidden = false;
        if (window.haigramHideInstallBanner) {
          window.haigramHideInstallBanner();
        }
      }, 20000);
    })();

    // ---- نافذة "إضافة إلى الشاشة الرئيسية" ----
    (function () {
      var banner = document.getElementById('install-banner');
      var text = document.getElementById('install-text');
      var yes = document.getElementById('install-yes');
      var no = document.getElementById('install-no');
      var deferred = null;

      var standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
      var dismissed = false;
      try {
        dismissed = localStorage.getItem('installDismissed') === '1';
      } catch (error) {
        console.warn('Unable to read install prompt preference:', error);
      }
      if (standalone || dismissed) return;

      function show() {
        if (window.haigramAppReady) banner.style.display = 'flex';
      }
      function hide() {
        banner.style.display = 'none';
        try {
          localStorage.setItem('installDismissed', '1');
        } catch (error) {
          console.warn('Unable to save install prompt preference:', error);
        }
      }
      window.haigramShowInstallBanner = show;
      window.haigramHideInstallBanner = function () {
        banner.style.display = 'none';
      };
      no.onclick = hide;

      // أندرويد / كروم: الحدث الرسمي
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        deferred = e;
        text.textContent = 'ثبّت Haigram على شاشتك الرئيسية لتجربة أسرع';
        yes.style.display = '';
        setTimeout(show, 2500);
      });
      yes.onclick = async function () {
        if (!deferred) return hide();
        var installPrompt = deferred;
        deferred = null;
        yes.disabled = true;
        try {
          await installPrompt.prompt();
          await installPrompt.userChoice;
          hide();
        } catch (error) {
          console.error('Unable to open the install prompt:', error);
          text.textContent = 'تعذر فتح التثبيت. استخدم قائمة المتصفح واختر "تثبيت التطبيق".';
          yes.style.display = 'none';
          no.textContent = 'إغلاق';
        } finally {
          yes.disabled = false;
        }
      };
      window.addEventListener('appinstalled', hide);

      // آيفون / سفاري: لا يوجد حدث، فنعرض تعليمات يدوية
      var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
      if (isIOS) {
        text.innerHTML = 'للتثبيت على آيفون: اضغط زر <b>المشاركة</b> ⬆️ ثم <b>إضافة إلى الشاشة الرئيسية</b>';
        yes.style.display = 'none';
        no.textContent = 'حسناً';
        setTimeout(show, 3500);
      }
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
