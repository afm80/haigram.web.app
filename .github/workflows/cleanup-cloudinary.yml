name: Cleanup Cloudinary

on:
  schedule:
    - cron: '0 3 * * 0' # أسبوعياً: الأحد 03:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true = تجربة فقط بدون حذف، false = حذف فعلي'
        required: true
        default: 'true'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install firebase-admin
        working-directory: scripts
        run: |
          npm init -y >/dev/null
          npm install firebase-admin@12 --no-audit --no-fund

      - name: Run cleanup
        working-directory: scripts
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: node cleanup-cloudinary.mjs
