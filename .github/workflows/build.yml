name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: 'اسم حزمة التطبيق (applicationId)'
        required: true
        default: 'com.haigram.app'
      app_name:
        description: 'اسم التطبيق الظاهر على الهاتف'
        required: true
        default: 'Haigram'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          cache: true

      # يولّد ملفات منصة أندرويد، ثم يضبط اسم الحزمة واسم التطبيق والصلاحيات
      - name: Generate Android scaffolding
        env:
          PKG: ${{ inputs.package_name }}
          APP_NAME: ${{ inputs.app_name }}
        run: |
          set -e
          if ! printf '%s' "$PKG" | grep -Eq '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$'; then
            echo "اسم الحزمة غير صالح: $PKG" >&2
            exit 1
          fi
          rm -rf android
          flutter create . --platforms=android --project-name lamha --org com.haigram >/dev/null

          GRADLE=$(ls android/app/build.gradle android/app/build.gradle.kts 2>/dev/null | head -1)
          MANIFEST=android/app/src/main/AndroidManifest.xml

          # اسم الحزمة (applicationId)
          sed -i -E "s/applicationId\s*=?\s*\"[^\"]+\"/applicationId = \"$PKG\"/" "$GRADLE"
          # حدّ أدنى 23 لمتطلبات مكتبات Firebase
          sed -i -E 's/(minSdk(Version)?)(\s*=\s*|\s+)flutter\.minSdkVersion/\1 = 23/' "$GRADLE"
          # اسم التطبيق الظاهر
          sed -i -E "s/android:label=\"[^\"]*\"/android:label=\"$APP_NAME\"/" "$MANIFEST"
          # صلاحية الإنترنت (غير موجودة في نسخة release افتراضياً)
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' "$MANIFEST"

          grep -n "applicationId\|minSdk" "$GRADLE"
          grep -n "INTERNET\|android:label" "$MANIFEST"

      - name: Install dependencies
        run: flutter pub get

      # أيقونة التطبيق من أيقونات المشروع (web/icons) بدل أيقونة Flutter الافتراضية
      - name: Generate launcher icon
        run: |
          set -e
          dart pub add --dev flutter_launcher_icons:^0.14.1
          cat > flutter_launcher_icons.yaml <<'YAML'
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "web/icons/Icon-512.png"
            adaptive_icon_background: "#0B0B12"
            adaptive_icon_foreground: "web/icons/Icon-maskable-512.png"
          YAML
          dart run flutter_launcher_icons

      - name: Build APK
        run: |
          flutter build apk --release \
            --dart-define=FB_API_KEY=${{ secrets.FB_API_KEY }} \
            --dart-define=FB_APP_ID=${{ secrets.FB_APP_ID }} \
            --dart-define=FB_SENDER_ID=${{ secrets.FB_SENDER_ID }} \
            --dart-define=FB_PROJECT_ID=${{ secrets.FB_PROJECT_ID }} \
            --dart-define=FB_AUTH_DOMAIN=${{ secrets.FB_AUTH_DOMAIN }} \
            --dart-define=FB_STORAGE_BUCKET=${{ secrets.FB_STORAGE_BUCKET }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: haigram-apk
          path: build/app/outputs/flutter-apk/app-release.apk
