<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="لمحة - فيديوهات قصيرة ومنشورات">
  <meta name="theme-color" content="#0B0B12">

  <!-- iOS PWA -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="لمحة">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">
  <title>لمحة</title>

  <style>
    html, body { margin: 0; height: 100%; background: #0B0B12; overflow: hidden; }
    #boot-splash {
      position: fixed; inset: 0; z-index: 100000; display: grid; place-items: center;
      background: radial-gradient(circle at 50% 38%, #282044 0, #0B0B12 54%, #0B0B12 100%);
      transition: opacity 320ms ease, visibility 320ms ease;
    }
    #boot-splash.is-hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .boot-mark {
      width: 76px; height: 76px; display: grid; place-items: center; border-radius: 24px;
      background: linear-gradient(135deg, #8B5CF6, #FF5BA9);
      box-shadow: 0 14px 44px rgba(139, 92, 246, .32);
      animation: boot-breathe 1.8s ease-in-out infinite;
    }
    .boot-mark::after {
      content: ""; width: 0; height: 0; margin-left: 5px;
      border-top: 17px solid transparent; border-bottom: 17px solid transparent;
      border-left: 27px solid white;
    }
    .boot-copy { margin-top: 18px; color: #F3F5F9; font: 700 20px system-ui, sans-serif; }
    .boot-loader { width: 28px; height: 3px; margin: 18px auto 0; border-radius: 9px; background: #353144; overflow: hidden; }
    .boot-loader::after { content: ""; display: block; width: 45%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #8B5CF6, #FF5BA9); animation: boot-progress 1.1s ease-in-out infinite alternate; }
    @keyframes boot-breathe { 50% { transform: scale(.96); } }
    @keyframes boot-progress { to { transform: translateX(125%); } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }
    #install-banner {
      display: none; position: fixed; z-index: 99999; left: 12px; right: 12px; bottom: 76px;
      background: #171A24; color: #F3F5F9; border: 1px solid rgba(255,255,255,.08); border-radius: 18px; padding: 14px 16px;
      font-family: system-ui, sans-serif; font-size: 14px; line-height: 1.5;
      box-shadow: 0 8px 30px rgba(0,0,0,.5); align-items: center; gap: 12px;
    }
    #install-banner button {
      border: 0; border-radius: 10px; padding: 9px 14px; font-weight: 700; cursor: pointer;
    }
    #install-yes { background: linear-gradient(135deg, #8B5CF6, #FF5BA9); color: #fff; }
    #install-no { background: transparent; color: #9AA2B5; }
    #install-text { flex: 1; }
  </style>
</head>
<body>
  <div id="boot-splash" role="status" aria-label="جارٍ تحميل لمحة">
    <div>
      <div class="boot-mark"></div>
      <div class="boot-copy">لمحة</div>
      <div class="boot-loader"></div>
    </div>
  </div>
  <div id="install-banner">
    <div id="install-text"></div>
    <button id="install-yes">تثبيت</button>
    <button id="install-no">لاحقاً</button>
  </div>

  <script>
    (function () {
      var splash = document.getElementById('boot-splash');
      function hideSplash() {
        if (!splash) return;
        splash.classList.add('is-hidden');
        setTimeout(function () { if (splash && splash.parentNode) splash.parentNode.removeChild(splash); }, 400);
      }
      window.addEventListener('flutter-first-frame', hideSplash, { once: true });
      setTimeout(hideSplash, 20000);
    })();

    // ---- نافذة "إضافة إلى الشاشة الرئيسية" ----
    (function () {
      var banner = document.getElementById('install-banner');
      var text = document.getElementById('install-text');
      var yes = document.getElementById('install-yes');
      var no = document.getElementById('install-no');
      var deferred = null;

      var standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
      if (standalone || localStorage.getItem('installDismissed')) return;

      function show() { banner.style.display = 'flex'; }
      function hide() { banner.style.display = 'none'; localStorage.setItem('installDismissed', '1'); }
      no.onclick = hide;

      // أندرويد / كروم: الحدث الرسمي
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        deferred = e;
        text.textContent = 'ثبّت لمحة على شاشتك الرئيسية لتجربة أسرع';
        yes.style.display = '';
        setTimeout(show, 2500);
      });
      yes.onclick = function () {
        if (!deferred) return hide();
        deferred.prompt();
        deferred.userChoice.finally(function () { deferred = null; hide(); });
      };

      // آيفون / سفاري: لا يوجد حدث، فنعرض تعليمات يدوية
      var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
      if (isIOS) {
        text.innerHTML = 'للتثبيت على آيفون: اضغط زر <b>المشاركة</b> ⬆️ ثم <b>إضافة إلى الشاشة الرئيسية</b>';
        yes.style.display = 'none';
        no.textContent = 'حسناً';
        setTimeout(show, 3500);
      }
    })();
  </script>

  <script src="trim.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
