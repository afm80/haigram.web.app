name: Build & Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          cache: true

      # يولّد ملفات منصة الويب الناقصة مع الحفاظ على ملفات web/ الخاصة بنا
      - name: Prepare web platform files
        run: |
          cp -r web /tmp/web-custom
          flutter create . --platforms=web --project-name lamha --org app.lamha >/dev/null
          cp -r /tmp/web-custom/. web/

      # ملف ffmpeg-core.wasm كبير (32MB) فلا يُرفع إلى GitHub، بل يُنزَّل هنا وقت البناء
      - name: Download ffmpeg-core.wasm
        run: |
          cd /tmp && npm pack @ffmpeg/core@0.12.6 >/dev/null
          tar -xzf ffmpeg-core-0.12.6.tgz package/dist/umd/ffmpeg-core.wasm
          cp package/dist/umd/ffmpeg-core.wasm $GITHUB_WORKSPACE/web/ffmpeg/ffmpeg-core.wasm

      - run: flutter pub get

      - name: Build web (PWA)
        run: |
          flutter build web --release \
            --dart-define=FB_API_KEY=${{ secrets.FB_API_KEY }} \
            --dart-define=FB_APP_ID=${{ secrets.FB_APP_ID }} \
            --dart-define=FB_SENDER_ID=${{ secrets.FB_SENDER_ID }} \
            --dart-define=FB_PROJECT_ID=${{ secrets.FB_PROJECT_ID }} \
            --dart-define=FB_AUTH_DOMAIN=${{ secrets.FB_AUTH_DOMAIN }} \
            --dart-define=FB_STORAGE_BUCKET=${{ secrets.FB_STORAGE_BUCKET }}

      - name: Deploy Firestore rules
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FB_PROJECT_ID: ${{ secrets.FB_PROJECT_ID }}
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          trap 'rm -f "$GOOGLE_APPLICATION_CREDENTIALS"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npm install --global firebase-tools
          firebase deploy --only firestore:rules --project "$FB_PROJECT_ID" --non-interactive

      - name: Deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.FB_PROJECT_ID }}
          channelId: live
