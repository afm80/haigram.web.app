name: haigram_main
description: Haigram - تطبيق اجتماعي للصور والمنشورات والقصص (PWA)
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  image_picker: ^1.1.2
  image: ^4.2.0
  cached_network_image: ^3.4.1
  shared_preferences: ^2.3.2
  intl: any
  url_launcher: ^6.3.1
  share_plus: 10.1.4
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/haigram-mark.png
    - assets/haigram-mark-dark.png
    - assets/haigram-mark-light.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/haigram-mark.png"
  remove_alpha_ios: true
