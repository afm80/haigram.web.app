name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable

      # إذا لم يكن مجلد web مرفوعاً، ينشئه هذا الأمر تلقائياً
      - name: Create web folder if missing
        run: |
          if [ ! -f web/index.html ]; then
            flutter create . --platforms web --project-name haipad
          fi

      - run: flutter pub get
      # الأخطاء الحقيقية توقف النشر؛ التحذيرات والملاحظات لا توقفه.
      - run: flutter analyze lib --no-fatal-infos --no-fatal-warnings
      - run: flutter build web --release

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: haipad
          channelId: live
