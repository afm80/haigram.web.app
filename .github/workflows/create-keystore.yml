name: Create Keystore (one time)

# يُشغَّل مرة واحدة فقط يدوياً. ينشئ مفتاح توقيع التطبيق ويضع القيم الأربعة في ملف نصي
# داخل Artifact (يُحذف بعد يوم واحد). يرفض العمل إذا كان المستودع عاماً.
on:
  workflow_dispatch:

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to run on a public repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          PRIVATE=$(gh api "repos/${{ github.repository }}" --jq .private)
          if [ "$PRIVATE" != "true" ]; then
            echo "::error::المستودع عام، والـ Artifact سيكون متاحاً للجميع. اجعل المستودع خاصاً (Private) ثم أعد التشغيل."
            exit 1
          fi

      - name: Generate keystore
        run: |
          set -e
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -keystore release.keystore -alias haigram \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Haigram, O=Haigram, C=IQ"
          {
            echo "ANDROID_KEYSTORE_BASE64"
            base64 -w 0 release.keystore
            echo
            echo
            echo "ANDROID_KEYSTORE_PASSWORD"
            echo "$PASS"
            echo
            echo "ANDROID_KEY_PASSWORD"
            echo "$PASS"
            echo
            echo "ANDROID_KEY_ALIAS"
            echo "haigram"
          } > keystore-secrets.txt

      - name: Upload secrets file (private, 1 day)
        uses: actions/upload-artifact@v4
        with:
          name: keystore-secrets
          path: keystore-secrets.txt
          retention-days: 1
