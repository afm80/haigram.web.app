name: Build & Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          cache: true

      # يولّد ملفات منصة الويب الناقصة مع الحفاظ على ملفات web/ الخاصة بنا
      - name: Prepare web platform files
        run: |
          cp -r web /tmp/web-custom
          flutter create . --platforms=web --project-name haigram --org app.haigram >/dev/null
          # flutter create يولّد اختباراً افتراضياً يشير إلى تطبيق غير موجود ويُفشل الفحص؛ نحذفه.
          rm -rf test
          cp -r /tmp/web-custom/. web/

      - run: flutter pub get

      # فحص الأخطاء البرمجية قبل البناء: إن وُجد خطأ يتوقف النشر وتظهر
      # رسالته (الملف والسطر) في صفحة Actions. التنبيهات البسيطة لا توقفه.
      - name: Analyze code (errors only)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Configure Firebase messaging service worker
        env:
          FB_API_KEY: ${{ secrets.FB_API_KEY }}
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_SENDER_ID: ${{ secrets.FB_SENDER_ID }}
          FB_PROJECT_ID: ${{ secrets.FB_PROJECT_ID }}
          FB_AUTH_DOMAIN: ${{ secrets.FB_AUTH_DOMAIN }}
          FB_STORAGE_BUCKET: ${{ secrets.FB_STORAGE_BUCKET }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'web/firebase-messaging-sw.js';
          let worker = fs.readFileSync(file, 'utf8');
          const values = {
            __FB_API_KEY__: process.env.FB_API_KEY,
            __FB_APP_ID__: process.env.FB_APP_ID,
            __FB_SENDER_ID__: process.env.FB_SENDER_ID,
            __FB_PROJECT_ID__: process.env.FB_PROJECT_ID,
            __FB_AUTH_DOMAIN__: process.env.FB_AUTH_DOMAIN,
            __FB_STORAGE_BUCKET__: process.env.FB_STORAGE_BUCKET,
          };
          for (const [placeholder, value] of Object.entries(values)) {
            if (!value) throw new Error(`Missing Firebase setting for ${placeholder}`);
            worker = worker.replaceAll(placeholder, value);
          }
          fs.writeFileSync(file, worker);
          NODE

      - name: Validate Web Push key
        env:
          FB_WEB_PUSH_VAPID_KEY: ${{ secrets.FB_WEB_PUSH_VAPID_KEY }}
        run: test -n "$FB_WEB_PUSH_VAPID_KEY"

      - name: Build web (PWA)
        run: |
          flutter build web --release --web-renderer canvaskit \
            --dart-define=FB_API_KEY=${{ secrets.FB_API_KEY }} \
            --dart-define=FB_APP_ID=${{ secrets.FB_APP_ID }} \
            --dart-define=FB_SENDER_ID=${{ secrets.FB_SENDER_ID }} \
            --dart-define=FB_PROJECT_ID=${{ secrets.FB_PROJECT_ID }} \
            --dart-define=FB_AUTH_DOMAIN=${{ secrets.FB_AUTH_DOMAIN }} \
            --dart-define=FB_STORAGE_BUCKET=${{ secrets.FB_STORAGE_BUCKET }} \
            --dart-define=FB_WEB_PUSH_VAPID_KEY=${{ secrets.FB_WEB_PUSH_VAPID_KEY }} \
            --dart-define=CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }} \
            --dart-define=CLOUDINARY_UPLOAD_PRESET=${{ secrets.CLOUDINARY_UPLOAD_PRESET }} \
            --dart-define=GIPHY_API_KEY=${{ secrets.GIPHY_API_KEY }}

      - name: Deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.FB_PROJECT_ID }}
          channelId: live

      - name: Deploy Firestore rules
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FB_PROJECT_ID: ${{ secrets.FB_PROJECT_ID }}
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          trap 'rm -f "$GOOGLE_APPLICATION_CREDENTIALS"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npm install --global firebase-tools
          firebase deploy --only firestore:rules --project "$FB_PROJECT_ID" --non-interactive

      - name: Deploy Storage rules
        # يتطلب خطة Blaze؛ على Spark يُتخطى بدون إيقاف النشر.
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FB_PROJECT_ID: ${{ secrets.FB_PROJECT_ID }}
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          trap 'rm -f "$GOOGLE_APPLICATION_CREDENTIALS"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npm install --global firebase-tools
          firebase deploy --only storage --project "$FB_PROJECT_ID" --non-interactive

      - name: Deploy chat notification function
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install and deploy chat notification function
        # يتطلب خطة Blaze؛ على Spark يُتخطى بدون إيقاف النشر.
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FB_PROJECT_ID: ${{ secrets.FB_PROJECT_ID }}
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          trap 'rm -f "$GOOGLE_APPLICATION_CREDENTIALS"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npm ci --prefix functions
          npm install --global firebase-tools
          firebase deploy --only functions --project "$FB_PROJECT_ID" --non-interactive

      # الفهارس في خطوة منفصلة وتأتي آخراً، فلا يتأثر النشر أعلاه إن فشلت،
      # لكن فشلها يظهر الآن بوضوح (علامة حمراء) بدل أن يُخفى.
      # إن فشلت: امنح حساب الخدمة دور Cloud Datastore Index Admin.
      - name: Deploy Firestore indexes
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FB_PROJECT_ID: ${{ secrets.FB_PROJECT_ID }}
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          trap 'rm -f "$GOOGLE_APPLICATION_CREDENTIALS"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          firebase deploy --only firestore:indexes --project "$FB_PROJECT_ID" --non-interactive
